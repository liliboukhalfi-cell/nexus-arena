# Construit l'APK Android de Zone Hostile (le jeu embarqué, sans Chrome) et le publie dans « Releases ».
# Lancement : onglet Actions → « APK Android » → Run workflow (ou en poussant un tag v1.2.3).
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Dépendances Capacitor
        run: npm install --no-audit --no-fund
      - name: Jeu + bibliothèques embarquées (app/www)
        run: node build-www.mjs
      - name: Projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#05080f' --iconBackgroundColorDark '#05080f' --splashBackgroundColor '#05080f' --splashBackgroundColorDark '#05080f'
          npx cap sync android
          node patch-android.mjs
      - name: Compilation
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            KS=release.keystore; export KSPASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; export KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::Aucune clé dans les secrets : APK signé avec une clé de test (les mises à jour demanderont de désinstaller)."
            keytool -genkeypair -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass testtest -keypass testtest -dname "CN=Zone Hostile"
            KS=test.keystore; export KSPASS=testtest; ALIAS=test; export KPASS=testtest
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KSPASS --ks-key-alias "$ALIAS" --key-pass env:KPASS --out ZoneHostile.apk aligned.apk
          "$BT/apksigner" verify ZoneHostile.apk
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneHostile-apk
          path: app/ZoneHostile.apk
      - name: Publication dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-{0}', github.run_number) }}
          name: Zone Hostile ${{ env.VERSION_NAME }}
          body: APK Android de Zone Hostile (jeu embarqué, fonctionne sans Chrome). Télécharge ZoneHostile.apk et installe-le.
          files: app/ZoneHostile.apk
          make_latest: true
